name: vybe
description: Vybe - Music Streaming app made in Flutter!
homepage: https://github.com/Shubham-Loshali/Vybe
repository: https://github.com/Shubham-Loshali/Vybe
issue_tracker: https://github.com/Shubham-Loshali/Vybe/issues

publish_to: 'none'
version: 10.6.4+207

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ^3.47.9

dependencies:
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.6
  cloud_firestore: ^5.6.5
  crypto: ^3.0.8
  cryptography: ^2.9.0
  dsrp: ^0.5.5
  dynamic_color: ^2.1.0
  file_picker: ^13.3.2
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_multicast_lock: ^1.2.1
  go_router: ^18.1.2
  google_sign_in: ^6.2.2
  hive_ce: ^2.23.0
  hive_ce_flutter: ^2.5.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  material_ui: ^1.9.0
  path_provider: ^2.1.6
  receive_sharing_intent:
    path: ./packages/receive_sharing_intent
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  youtube_explode_dart:
    path: ./packages/youtube_explode_dart
  youtube_music_explode_dart:
    path: ./packages/youtube_music_explode_dart
dev_dependencies:
  flutter_test:
    sdk: flutter

  just_audio_platform_interface: ^4.6.0

  # flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/audio/opening.mp3
    - assets/licenses/
    - assets/icons/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree_400Regular.ttf
          weight: 400
        - asset: assets/fonts/figtree/Figtree_500Medium.ttf
          weight: 500
        - asset: assets/fonts/figtree/Figtree_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/figtree/Figtree_700Bold.ttf
          weight: 700
        - asset: assets/fonts/figtree/Figtree_800ExtraBold.ttf
          weight: 800
    - family: paytoneOne
      fonts:
        - asset: assets/fonts/paytone/PaytoneOne-Regular.ttf
